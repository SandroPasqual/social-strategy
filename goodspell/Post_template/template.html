<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- DARK variant -->
<div class="card dark">
  <div class="gold-line"></div>
  <div class="text">
    <div class="s1">The opportunity came.</div>
    <div class="s2">The presence wasn't ready.</div>
    <div class="s3">By the time it was, the moment had passed.</div>
  </div>
  <div class="logo-wrap">
    <img src="logo-dark.svg" alt="Goodspell" width="460" height="69">
  </div>
</div>

<!-- LIGHT variant -->
<div class="card light">
  <div class="gold-line"></div>
  <div class="text">
    <div class="s1">Editează prima propoziție aici.</div>
    <div class="s2">Editează a doua propoziție aici.</div>
    <div class="s3">Editează a treia propoziție aici.</div>
  </div>
  <div class="logo-wrap">
    <img src="logo-light.svg" alt="Goodspell" width="460" height="69">
  </div>
</div>

</body>
</html>
